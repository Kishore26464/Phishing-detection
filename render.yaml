services:
  - type: web
    name: phishing-detection-api
    runtime: python
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: FIREBASE_CREDENTIALS_PATH
        value: backend/phishguard-38c10-firebase-adminsdk-fbsvc-a3ca72c671.json
    autoDeploy: true
    # Set these secrets in Render Dashboard after deploying:
    # Environment → Add Secret
    #   VIRUSTOTAL_API_KEY = your_key
    #   GOOGLE_SAFE_BROWSING_KEY = your_key
